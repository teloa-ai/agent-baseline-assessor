# 自评工具的 nginx 配置：纯静态，严格的内容安全策略，不允许页面连接任何外部地址
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    # MIME 类型沿用 nginx 自带的 mime.types（已包含 xlsx），这里不要再写 types {}，否则会覆盖整张表
    location / {
        try_files $uri $uri/ =404;
    }

    # 只发布页面需要的文件
    location ~ /(tools|node_modules|deploy|\.git|\.github)/ { return 404; }
    location ~ /(package\.json|package-lock\.json|README\.md)$ { return 404; }
}
